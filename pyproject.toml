[project]
name = "jesi"
dynamic = ["version"]
description = "Dark Energy Jaxoscopic Instrument"
requires-python = ">=3.10,<3.14"
dependencies = [
    "anesthetic>=2.10.0",
    "blackjax",
    "tfp-nightly",
    "tqdm>=4.67.1",
    "fire",
    "jax",
    "polychord",
]

[tool.setuptools.packages.find]
include = ["jesi"]

[tool.setuptools.package-data]
jesi = [
    "likelihoods/data/des5y/*",
    "likelihoods/data/desidr2/*",
    "likelihoods/data/pantheonplus/*"
]

[project.optional-dependencies]
cuda= ["jax[cuda]"]

[tool.uv.sources]
blackjax = { git = "https://github.com/handley-lab/blackjax", rev = "refactor-slice-sampling-api" }
polychord = { git = "ssh://github.com/PolyChord/polychord", rev = "master" }

[build-system]
requires = ["setuptools_scm>=8"]

[tool.setuptools_scm]
version_file = "jesi/_version.py"
