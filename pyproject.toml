[project]
name = "jesi"
dynamic = ["version"]
description = "Dark Energy Jaxoscopic Instrument"
requires-python = ">=3.10,<3.14"
dependencies = [
    "anesthetic>=2.10.0",
    "blackjax",
    "tensorflow-probability>=0.25.0",
    "tqdm>=4.67.1",
    "fire",
    "fastprogress!=1.1.3,!=1.1.2,!=1.1.1,!=1.1.0",
    "jax<0.8.0"
]

[tool.setuptools.packages.find]
include = ["jesi"]

[tool.setuptools.package-data]
jesi = [
    "likelihoods/data/des5y/*",
    "likelihoods/data/desidr2/*",
    "likelihoods/data/pantheonplus/*"
]

[project.optional-dependencies]
cuda12= ["jax[cuda12]"]

[tool.uv.sources]
blackjax = { git = "https://github.com/handley-lab/blackjax", rev = "nested_sampling" }

[build-system]
requires = ["setuptools_scm>=8"]

[tool.setuptools_scm]
version_file = "jesi/_version.py"
