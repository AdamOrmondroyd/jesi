[project]
name = "jesi"
dynamic = ["version"]
description = "Dark Energy Jaxoscopic Instrument"
requires-python = "==3.13.14"
dependencies = [
    "anesthetic>=2.10.0",
    "blackjax",
    "tfp-nightly",
    "tqdm>=4.67.1",
    "fire",
    "jax",
]

[tool.setuptools.packages.find]
include = ["jesi"]

[tool.setuptools.package-data]
jesi = [
    "likelihoods/data/des5y/*",
    "likelihoods/data/desidr2/*",
    "likelihoods/data/pantheonplus/*"
]

[project.optional-dependencies]
cuda = ["jax[cuda]"]
mac = ["jax-mps==0.10.10"]

[tool.uv.sources]
blackjax = { git = "https://github.com/handley-lab/blackjax" }

[build-system]
requires = ["setuptools_scm>=8"]

[tool.setuptools_scm]
version_file = "jesi/_version.py"
